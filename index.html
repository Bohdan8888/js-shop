<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Shop</title>
    <link rel="stylesheet" href="./node_modules/normalize.css/normalize.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <script defer src="./js/products.js"></script>
    <script defer src="./js/main.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <h1 class="logo"><span aria-hidden="true">JS</span>JS Shop</h1>
        <a class="header-cart" href="#shopping-cart">
          <img src="./img/cart.svg" alt="" width="24" height="24" />Cart
        </a>
        
      </div>
      <div class="input-contain">
<input type="search" class="product-search" placeholder="Search products...">
 <ul class="search-results"></ul>
      </div>
    </header>

    <main>
      <section class="catalog-section">
        <h2>Products</h2>
        <p class="catalog-caption">Explore our smartphone collection</p>

        <ul class="products"></ul>
      </section>

      <section class="cart-section" id="shopping-cart">
        <h2>Shopping Cart</h2>

        <ul class="cart"></ul>
        <p class="cart-empty">Your cart is empty.</p>

        <p class="cart-total" aria-live="polite">
          <span>Total</span>
          <strong>$<span class="total-price">0</span></strong>
        </p>
      </section>
    </main>
  </body>
</html>
