<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&amp;display=swap">
    <link rel="stylesheet" href="./css/styles.css">
    <script defer src="./js/products.js"></script>
    <script defer src="./js/main.js"></script>
</head>
<body>
    <header class="header">
  <h1 class="logo">JS Shop</h1>
  <p>Cart: <span class="cart-count">0</span></p>
</header>

<main>
  <section class="catalog-section">
    <h2>Products</h2>

    <ul class="products"></ul>
  </section>

  <section class="cart-section">
    <h2>Shopping Cart</h2>

    <ul class="cart"></ul>

    <p>Total: $<span class="total-price">0</span></p>
  </section>
</main>

</body>
</html>
